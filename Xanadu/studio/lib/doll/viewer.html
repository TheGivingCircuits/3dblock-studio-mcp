const q = new URLSearchParams(location.search), PW = 318;

const ui = document.getElementById('ui'); ui.innerHTML = '<h3>DOLL STUDIO</h3>';

select(s, 'beard', ['none', 'stubble', 'moustache', 'full'], () => look.beard || 'none', v => { look.beard = v === 'none' ? undefined : v; rebuild(); });

slider(s, 'ear size', .5, 2, .01, () => look.ear || 1, v => set('ear', v));
s = section('Clothes');
color(s, 'top', () => look.top, v => set('top', v));
select(s, 'sleeves', ['long', 'short', 'none'], () => look.sleeves, v => set('sleeves', v));
color(s, 'bottom', () => look.bottom, v => set('bottom', v));
select(s, 'bottom style', ['pants', 'shorts', 'skirt'], () => look.bottomStyle || 'pants', v => set('bottomStyle', v));
color(s, 'shoes', () => look.shoes, v => set('shoes', v));
s = section('Armor');
flag(s, 'armor on', () => !!look.armor, () => { look.armor = look.armor ? null : { color: '#aab2bc', trim: '#c9a24a', pieces: ['helmet', 'chest', 'pauldrons', 'bracers', 'gauntlets', 'greaves', 'knees', 'belt'] }; rebuild(); });
color(s, 'metal', () => look.armor?.color || '#aab2bc', v => { if (look.armor) { look.armor.color = v; rebuild(); } });
color(s, 'trim', () => look.armor?.trim || '#c9a24a', v => { if (look.armor) { look.armor.trim = v; rebuild(); } });

slider(s, 'speed', .3, 2.5, .05, () => speed, v => { speed = v; doll.setPose(pose, speed); });
flag(s, 'walk around', () => walkAround, () => { walkAround = !walkAround; if (walkAround) { prevPose = pose; pose = 'walk'; } else { pose = prevPose === 'walk' ? 'stand' : prevPose; home.position.set(0, 0, 0); home.rotation.y = 0; } doll.setPose(pose, speed); });

s = section('Emotion & face');
btns(s, Object.keys(EMOTIONS), e => emo === e, e => { emo = e; doll.setEmotion(e); });
flag(s, 'talk', () => talking, () => { talking = !talking; mouthManual = null; doll.talk(talking); });
flag(s, 'look at camera', () => lookCam, () => lookCam = !lookCam);
{ const b = document.createElement('button'); b.textContent = 'blink'; b.onclick = () => doll.blink(); s.appendChild(b); }
slider(s, 'mouth open', 0, 1, .01, () => mouthManual ?? 0, v => { mouthManual = v; talking = false; doll.talk(false); doll.setMouth(v); });

const camBtns = { full: () => frame(), '3/4': () => frame(.7), side: () => frame(1.57), back: () => frame(3.14), face: () => faceCam(), hands: () => handsCam() };
btns(s, Object.keys(camBtns), () => false, k => camBtns[k]());
s = section('Save / load', false);
const ta = document.createElement('textarea'); ta.rows = 6; ta.style.width = '100%'; s.appendChild(ta);
{ const a = document.createElement('button'); a.textContent = 'Copy look JSON'; a.onclick = () => { ta.value = JSON.stringify(look, null, 1); ta.select(); navigator.clipboard?.writeText(ta.value); msg('look copied'); }; s.appendChild(a);

if (q.get('preset') && PRESETS[q.get('preset')]) look = JSON.parse(JSON.stringify(PRESETS[q.get('preset')]));

rebuild(); sync(); frame(+q.get('yaw') || 0); if (q.get('face')) faceCam(); if (q.get('hideui')) ui.style.display = 'none';

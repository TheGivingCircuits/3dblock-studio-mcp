// ---------- HUD ----------

// ---------- the set: photo prints, three era TVs, the console under the home TV ----------

  ['tgs', 'tgs-2005.jpg', 4.2, 1.8, 3.6, .12, "'05 9 18", 'Photo: drdemento · CC BY 2.0 · Wikimedia Commons', ['L1', 'may', -.2]],

const ST = {}, TV = {}; let hero, home, wall, leds, racks = [], MAN = {};
const HOME = [[.3, -16.6, 4.3], [0, 0, 1.45]];

const TW = 1280, TH = 860, SCR = { x: 46, y: 40, w: 1188, h: 668 };

function updateBar(t) {

  const pct = t < t1 ? 1 : 2, x = 160, y = 330, w = 760; hg.save(); hg.globalAlpha = a; hg.beginPath(); hg.roundRect(x - 30, y - 70, w + 60, 170, 18); hg.fillStyle = 'rgba(8,10,16,.88)'; hg.fill();
  hg.fillStyle = '#e8eef8'; hg.font = `600 36px ${FONT}`; hg.textAlign = 'left'; hg.textBaseline = 'middle'; hg.fillText('Downloading update data…', x, y - 22); hg.textAlign = 'right'; hg.fillText(pct + '%', x + w, y - 22);
  hg.fillStyle = 'rgba(255,255,255,.15)'; hg.fillRect(x, y + 22, w, 18); const pg = hg.createLinearGradient(x, 0, x + w, 0); pg.addColorStop(0, '#3a8bff'); pg.addColorStop(1, '#7fd0ff'); hg.fillStyle = pg; hg.fillRect(x, y + 22, w * pct / 100 + 4, 18);
  hg.fillStyle = 'rgba(255,255,255,.55)'; hg.font = `500 28px ${FONT}`; hg.textAlign = 'left'; hg.fillText('Time remaining: about forever', x, y + 72); hg.restore();
}
function hudDraw(t, clipNow) {
  hg.clearRect(0, 0, W, H);
  const ta = Math.max(1 - P(t, .25, .6), P(t, at('L12', 'back') + .2, .8));
  if (ta > 0) { drawBig(big('t1', 'THE PS3 ERA', 92, '#dfe6f0'), W / 2, 300, ta); drawBig(big('t2', 'TAKE ME BACK', 196, '#e4ecf7'), W / 2, 450, ta); }
  chip(t, clipNow, 520);
  trophy(t); updateBar(t);
  const c0 = at('L10', 'seventeen') - .1, c1 = at('L10', 'sixty') + .45;
  if (t > c0 && t < en('L10') + .6) { const a = P(t, c0, .2) * (1 - P(t, en('L10') + .3, .3)), n = Math.round(1760 * P(t, c0, c1 - c0)); drawBig(chrome(n.toLocaleString('en-US'), 230, '#d8f1ff', COND, '#3cd2ff'), W / 2, 400, a); drawBig(big('ps3s', 'PS3s', 80, '#d8f1ff', '#3cd2ff'), W / 2, 545, a); }
  const m0 = at('L11', 'eighty') - .1, m1 = at('L11', 'sold') + .3;
  if (t > m0 && t < en('L11') + .5) { const a = P(t, m0, .2) * (1 - P(t, en('L11') + .2, .3)), n = Math.round(87400000 * eo(P(t, m0, m1 - m0)) / 100000) * 100000; drawBig(chrome(n.toLocaleString('en-US'), 170, '#ffffff', COND, BLUE), W / 2, 330, a); drawBig(big('sold', 'SOLD WORLDWIDE', 64, '#dfe6f0'), W / 2, 445, a); }
  const rw = P(t, st('L12') - .15, .2) * (1 - P(t, st('L12') + 1.3, .3));

  const q = (NB.TL.clips || []).find(c => c.quote && t >= c.start && t < c.start + c.dur);

// ---------- build ----------
async function build() {
  MAN = await (await fetch('/tech/ps3/footage/cuts/manifest.json')).json();
  const imgs = {}; await Promise.all([...PR.map(p => p[1]), 'ps3-launch-model.png'].map(async f => { imgs[f] = await load(f); }));
  for (const [k, f, x, y, w, yaw, date, credit, pop] of PR) ST[k] = Object.assign(standee(printCanvas(imgs[f], date, credit), w, x, y, yaw), { pop });
  for (const [k, [x, y, pop]] of Object.entries(TVDEF)) { const c = cnv(TW, TH), g = c.getContext('2d'), tv = { c, g, pop, x, y }; tv.s = standee(c, 5.4, x, y, 0, true); TV[k] = tv; tvFrame(tv, null, 0); }
  hero = standee(imgs['ps3-launch-model.png'], 5, 0, 0, 0, true); hero.set(1);
  home = standee(imgs['ps3-launch-model.png'], 2.4, 36.2, -1.6, 0, true);
  // 1,760 tiny PS3s racked into a supercomputer behind the real photo: 8 racks x 4 across x 55 shelves
  const mini = texOf(imgs['ps3-launch-model.png']); mini.repeat.set(.7, 1); mini.offset.set(.3, 0);
  const mg = new THREE.PlaneGeometry(.15, .085); mg.rotateX(Math.PI / 2);
  wall = new THREE.InstancedMesh(mg, new THREE.MeshBasicMaterial({ map: mini, transparent: true, alphaTest: .5, side: THREE.DoubleSide }), 1760); wall.userData.slots = [];
  for (let i = 0; i < 1760; i++) { const sh = Math.floor(i / 32), j = i % 32, rk = Math.floor(j / 4), cl = j % 4; wall.userData.slots.push([46 - 2.95 + rk * .75 + cl * .16 + .1, 3.2, .12 + sh * .1]); }
  wall.frustumCulled = false; scene.add(wall);
  const lg = new THREE.PlaneGeometry(.05, .05); lg.rotateX(Math.PI / 2);
  leds = new THREE.InstancedMesh(lg, new THREE.MeshBasicMaterial({ color: '#46d6ff', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), 1760); leds.frustumCulled = false; scene.add(leds);
  const rackTex = (() => { const c = cnv(128, 1024), g = c.getContext('2d'); g.fillStyle = '#14171c'; g.fillRect(0, 0, 128, 1024); g.fillStyle = '#2a2f37'; for (let y = 0; y < 1024; y += 18.6) g.fillRect(0, y, 128, 3); g.fillRect(0, 0, 6, 1024); g.fillRect(122, 0, 6, 1024); return texOf(c); })();
  for (let rk = 0; rk < 8; rk++) { const geo = new THREE.PlaneGeometry(.7, 5.6); geo.rotateX(Math.PI / 2); geo.translate(0, 0, 2.8); const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: rackTex })); m.position.set(46 - 2.95 + rk * .75 + .32, 3.32, 0); m.visible = false; scene.add(m); racks.push(m); }
}
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3();

// ---------- camera path ----------
let SHOTS = null;
const clipStart = id => (NB.TL.clips.find(c => c.id === id) || { start: 0 }).start;
function shots() {
  const F = (k, d = 15, dx = 0, dz = 0) => { const s = ST[k], cz = s.h * .5; return [[s.x + .25 + dx, s.y - d, cz + 1.1 + d * .07 + dz], [s.x + dx, s.y, cz]]; };
  const T = (k, d = 16.2, dx = 0, dz = 0) => { const tv = TV[k], cz = tv.s.h * .56; return [[tv.x + .2 + dx, tv.y - d, cz + 1.0 + d * .06 + dz], [tv.x + dx, tv.y, cz]]; };
  return [
    [0, 1, ...HOME],
    [at('L1', 'may') - .15, 1.5, ...T('A')],
    [clipStart('rev05') - .1, 4.2, ...T('A', 13.2)],
    [st('L2') - .3, .8, ...T('A', 15.6)],
    [at('L4', 'and') - .3, .9, ...F('e305', 13.8, .9)],
    [st('L5') - .2, 1.5, ...T('B')],
    [clipStart('crab1') - .15, .5, ...T('B', 13.4)],
    [clipStart('price') - .05, .25, ...T('B', 12.2)],
    [st('L6') - .2, 1.1, ...F('line')],
    [at('L6', 'anyway') - .35, .9, ...F('syd', 16.5, -1.2)],
    [st('L7') - .2, 1.5, ...T('C', 16.6, 0, .2)],
    [st('L8') - .1, 9, ...T('C', 13.4)],
    [st('L9'), 1.0, ...T('C', 16.6, 0, .3)],
    [st('L10') - .2, 1.5, ...F('condor')],
    [at('L10', 'seventeen') - .2, 2.0, [46.2, -18.5, 7.2], [46, 2.6, 3.0]],
    [st('L11') - .25, 1.7, [-4.5, -12.5, 7.2], [24, 1.5, 1.9]],
    [st('L12') - .15, 1.5, ...HOME],
  ];
}
const SKY = () => [[0, '#2a5ca8', '#040914'], [st('L5') - .2, '#6b3fb5', '#0b0616'], [st('L6') - .2, '#c2661a', '#120902'], [st('L7') - .2, '#b8402e', '#140504'],
  [st('L10') - .2, '#1a93ad', '#021015'], [st('L11') - .25, '#2f4fb0', '#05081a'], [st('L12') - .15, '#2a5ca8', '#040914']];
const cA = new THREE.Color(), cB = new THREE.Color(), tmpC = new THREE.Color();

window.seek = async function (t) {
  if (!SHOTS) SHOTS = shots();
  const E = END(), ph = TAU * t / E;
  // camera
  let cp = SHOTS[0][2].slice(), cl = SHOTS[0][3].slice();
  for (const [t0, d, p, l] of SHOTS) { const k = eio(P(t, t0, d)); if (k <= 0) break; cp = cp.map((v, i) => lerp(v, p[i], k)); cl = cl.map((v, i) => lerp(v, l[i], k)); }
  const live = P(t, .4, 1) * (1 - P(t, E - 1.6, 1.2));
  let shake = 0; for (const id of ['rev05', 'ridge', 'price']) { const d = t - clipStart(id) - (id === 'rev05' ? 2.9 : .1); if (d > 0 && d < .45) shake += Math.exp(-d * 10) * .1; }
  camera.position.set(cp[0] + Math.sin(ph * 3) * .22 * live + Math.sin(t * 53) * shake, cp[1], cp[2] + Math.sin(ph * 4 + 1) * .1 * live + Math.cos(t * 41) * shake);
  camera.lookAt(cl[0], cl[1], cl[2]);
  const SK = SKY(); cA.set(SK[0][1]); cB.set(SK[0][2]); for (const [t0, a, b] of SK) { const k = eio(P(t, t0, .9)); if (k <= 0) break; cA.lerp(tmpC.set(a), k); cB.lerp(tmpC.set(b), k); }
  skyMat.uniforms.uA.value.copy(cA); skyMat.uniforms.uB.value.copy(cB); skyMat.uniforms.uPh.value = ph; skyMat.uniforms.uDay.value = 0;
  floor.material.color.copy(cB).multiplyScalar(.6);
  // everything pops up on its word; "Take me back" folds the whole timeline down, far end first
  const AT = (id, w) => w ? at(id, w) : st(id), tR = st('L12') - .15, fold = x => 1 - eio(P(t, tR + (60 - x) / 60 * .8, .45));
  for (const s of Object.values(ST)) { const [id, w, off] = s.pop; s.set(back(P(t, AT(id, w) + off, .5)) * fold(s.x)); }
  for (const tv of Object.values(TV)) { const [id, w, off] = tv.pop; tv.s.set(back(P(t, AT(id, w) + off, .55)) * fold(tv.x)); }
  home.set(back(P(t, at('L7', 'turned') - .3, .5)) * fold(home.x));
  // the supercomputer wall
  const w0 = at('L10', 'seventeen') - .1, w1 = at('L10', 'sixty') + .45, wOut = P(t, tR, .5), on = t > at('L10', 'them') - .1 && wOut < 1;
  racks.forEach(r => { r.visible = t > w0 - .2 && wOut < 1; r.scale.z = clamp(P(t, w0 - .2, .4)) * (1 - wOut) || .001; });
  const sl = wall.userData.slots;
  for (let i = 0; i < 1760; i++) { const ti = lerp(w0, w1, i / 1760), k = eo(P(t, ti, .35)) * (1 - eio(clamp(wOut * 1.6 - (i % 97) / 160))), [x, y, z] = sl[i];
    V.set(x, lerp(y - 9, y, k), lerp(z + 2.5, z, k)); S.setScalar(k > .001 ? 1 : 0); M4.compose(V, Q, S); wall.setMatrixAt(i, M4);
    const blink = on && ((i * 7919 + Math.floor(t * 9) * 104729) % 13) > 3; V.set(x + .05, y - .01, z + .02); S.setScalar(blink && k > .99 ? 1 : 0); M4.compose(V, Q, S); leds.setMatrixAt(i, M4); }
  wall.instanceMatrix.needsUpdate = true; leds.instanceMatrix.needsUpdate = true;
  // TV screens: the clip frame for this instant (held for half a second after a clip ends so cuts never flash black)
  let clipNow = null, best = 1e9;
  await Promise.all(Object.entries(TV).map(async ([k, tv]) => {
    if (!tv.s.pivot.visible) return; const c = activeClip(k, t) || lastClip(k, t); let img = null;
    if (c && MAN[c.id]) { const n = Math.max(1, Math.min(MAN[c.id], Math.floor((Math.min(t, c.start + c.dur - .001) - c.start) * 30) + 1)); img = await frameImg(c.id, n); }
    tvFrame(tv, img, c ? 1 : 0);
    const d = Math.abs(tv.x - camera.position.x); if (c && activeClip(k, t) && d < best) { best = d; clipNow = c; }
  }));
  renderer.setClearColor('#000'); renderer.clear(); renderer.render(skyScene, skyCam); renderer.clearDepth(); renderer.render(scene, camera);
  hudDraw(t, best < 6 ? clipNow : null); hudTex.needsUpdate = true; renderer.clearDepth(); renderer.render(hudScene, hudCam);
  return true;
};
window.setTL = tl => { NB.TL = tl; CHUNKS = null; SHOTS = null; return true; };
Promise.all([document.fonts.load(`bold 100px ${COND}`), document.fonts.load(`bold 60px ${FONT}`), build()]).then(() => { window.ready = true; }).catch(e => { document.title = 'ERR ' + e.message; throw e; });
</script>
